# Nach der Vorlage aus ict-baden/richtlinien, für eine Android-App (Gradle statt .NET, APK statt MSI).
name: Build

# Wann wie viel gebaut wird, steht in Richtlinie 04 („Wann die CI baut“). Kurz: Pushs und PRs bauen, testen und prüfen
# nur (Debug-APK, Unit-Tests, Lint). Signiert und veröffentlicht wird nur im vollen Build: nachts (nur wenn main neu ist),
# bei Tags, von Hand und mit [voll] in der Commit-Nachricht. Reine Doku startet nichts.
on:
  push:
    branches: [main]
    tags: ['v*'] # Pfadfilter gelten für Tags nicht, ein Tag baut immer
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  schedule:
    - cron: '3 3 * * *' # Minute je Repo anders, damit nicht alle gleichzeitig starten
  workflow_dispatch:

permissions:
  contents: write # für die Releases

# Läufe auf demselben Branch nacheinander, damit sich die 'latest'-Releases nicht überholen.
# In PRs bricht ein neuer Push den alten Lauf ab.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: IndustrialKeyboard

jobs:
  # Entscheidet, wie viel dieser Lauf baut. run=false: nichts zu tun (Nachtlauf ohne neue Commits).
  # full=true: signierter Release-Build, Releases (bei Android das Einzige, was der volle Build zusätzlich macht).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      full: ${{ steps.gate.outputs.full }}
    steps:
      - name: Umfang bestimmen
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
          # Geänderte Dateien, bei denen ein PR voll bauen soll. Android baut nur unter Linux, und Signieren und Releases
          # laufen in PRs ohnehin nie: voll heißt im PR dasselbe wie sonst. Bleibt für Workflow-Änderungen (Richtlinie 04).
          FULL_PATHS: '^\.github/'
          # Reine Doku, wie paths-ignore oben
          DOC_PATHS: '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)'
        run: |
          set -euo pipefail
          run=true; full=false
          case "$EVENT" in
            workflow_dispatch) full=true ;;
            push)
              # Bei mehreren Commits in einem Push zählt die Nachricht des letzten
              if [ "$GITHUB_REF_TYPE" = tag ] || [[ "$MSG" == *"[voll]"* ]]; then full=true; fi ;;
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
              if [[ ",$LABELS," == *",voll-bauen,"* ]] || grep -qE "$FULL_PATHS" <<< "$files"; then full=true; fi ;;
            schedule)
              # Der Tag 'latest' steht auf dem Commit des letzten vollen Builds von main
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq .object.sha 2>/dev/null || true)
              if [ "$built" = "$GITHUB_SHA" ]; then
                run=false
              else
                # Scheitert der Vergleich (kein 'latest', Verlauf umgeschrieben), wird voll gebaut
                changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$built...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo '?')
                if [ -n "$built" ] && ! grep -qvE "$DOC_PATHS" <<< "$changed"; then run=false; else full=true; fi # sonst nur Doku
              fi ;;
          esac
          echo "Ereignis: $EVENT  run=$run  full=$full"
          { echo "run=$run"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  # Läuft bei jedem Push und PR. Signieren und Releases nur im vollen Build (SIGN unten).
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.gate.outputs.full }}
      # Signieren nur im vollen Build, mit dem Keystore aus den Secrets (siehe richtlinien/05-signieren.md) und nicht bei
      # Pull Requests. Ohne Schlüssel wird gebaut und getestet, aber nichts veröffentlicht: Eine unsignierte APK lässt sich
      # nicht installieren, und eine mit einem anderen Schlüssel signierte ließe sich später nicht mehr aktualisieren.
      SIGN: ${{ secrets.ANDROID_KEYSTORE != '' && github.event_name != 'pull_request' && needs.gate.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # Schritte, die nur bei Tags oder auf main laufen, sonst erst beim Release prüfen: alle PowerShell-Blöcke parsen
      - name: PowerShell-Syntax (alle Workflow-Schritte und Skripte)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/ps-syntax.py > "$RUNNER_TEMP/ps-blocks.json"
          pwsh -NoProfile -File .github/scripts/ps-syntax.ps1 -Blocks "$RUNNER_TEMP/ps-blocks.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Basisversion aus app/build.gradle.kts mit Laufnummer
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"; suffix="-$v"
          else
            base=$(grep -oP 'versionName = .*?"\K[0-9.]+' app/build.gradle.kts)
            v="$base-ci.$GITHUB_RUN_NUMBER"; suffix=""
          fi
          # versionCode muss bei jedem Build steigen, sonst verweigern Android und das MDM das Update
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Version: $v (Code $GITHUB_RUN_NUMBER), Signieren: $SIGN"

      - name: Tests, Lint und Debug-APK
        # Debug-APK nur als Probe, dass sich die App bauen lässt (Release-Build gibt es nur im vollen Build)
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Testergebnisse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Keystore bereitstellen
        if: env.SIGN == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK und App Bundle bauen und signieren
        if: env.SIGN == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS12-Keystores haben ein gemeinsames Passwort für Store und Schlüssel; eigenes Secret nur, falls abweichend
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --console=plain -PversionName=${{ steps.version.outputs.version }} -PversionCode=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APP${{ steps.version.outputs.suffix }}.apk"
          # Das App Bundle ist für Google Play (mit unserem Schlüssel als Upload-Schlüssel, siehe docs/play-store.md)
          cp app/build/outputs/bundle/release/app-release.aab "dist/$APP${{ steps.version.outputs.suffix }}.aab"
          # Prüfen, dass wirklich mit dem Release-Schlüssel signiert wurde
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/$APP${{ steps.version.outputs.suffix }}.apk" | head -3
          jarsigner -verify "dist/$APP${{ steps.version.outputs.suffix }}.aab" | grep -q "jar verified" || { echo "::error::App Bundle ist nicht signiert"; exit 1; }
          rm "$RUNNER_TEMP/release.jks"

      - name: Ohne Schlüssel nichts veröffentlichen
        if: env.SIGN != 'true' && env.FULL == 'true' && github.event_name != 'pull_request'
        run: echo "::notice::Kein Keystore in den Secrets (ANDROID_KEYSTORE …) – gebaut und getestet, aber keine APK veröffentlicht."

      - name: Prüfsummen
        if: env.SIGN == 'true'
        working-directory: dist
        run: sha256sum *.apk *.aab | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: env.SIGN == 'true'
        with:
          name: ${{ env.APP }}-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Release erstellen (nur bei Tag v*)
        if: env.SIGN == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.0.0-rc1 und ähnliche: Vorabversion, nicht „Latest“
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          v="${GITHUB_REF_NAME#v}"
          # Release-Text englisch, ohne --generate-notes (deutsche PR-Titel): oben die Nachricht des annotierten Tags
          # (der CHANGELOG-Abschnitt auf Englisch, git tag -a vX.Y.Z -F notes.md --cleanup=verbatim), darunter die Dateien.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message > "$RUNNER_TEMP/tag.md"
          else
            echo "::warning::$GITHUB_REF_NAME ist kein annotierter Tag – Release-Text nur mit der Dateiliste."
            : > "$RUNNER_TEMP/tag.md"
          fi
          {
            if [ -s "$RUNNER_TEMP/tag.md" ]; then cat "$RUNNER_TEMP/tag.md"; echo; fi
            echo "**Files** – signed with the ICT-Baden release key; all changes in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) (German):"
            echo
            echo "- **$APP-$v.apk**: to distribute with your MDM (SOTI, Intune, Workspace ONE, StageNow) or to install with adb"
            echo "- **$APP-$v.aab**: App Bundle for Google Play"
            echo "- **SHA256SUMS.txt**: checksums, check with \`sha256sum -c --ignore-missing SHA256SUMS.txt\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "$APP $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $pre

      - name: "Release 'latest' aktualisieren (main)"
        # Auch nachts und bei [voll]-Pushs (Richtlinie 04); SIGN gibt es nur im vollen Build
        if: env.SIGN == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Rollierendes Release: immer der neueste main-Stand, unter festen Links (Einzelheiten im Skript)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/latest"
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $notes = "Automatic build of main ($($env:GITHUB_SHA.Substring(0,7))), version ${{ steps.version.outputs.version }}, built $built UTC, signed. For testing – for production use the newest tagged release.`n`n" +
                   "The links stay the same and always point to the newest build:`n`n" +
                   "- **[$env:APP.apk]($base/$env:APP.apk)**: to distribute with your MDM (SOTI, Intune, Workspace ONE, StageNow) or to install with adb`n" +
                   "- [SHA256SUMS.txt]($base/SHA256SUMS.txt): checksums"
          ./.github/scripts/release-latest.ps1 -Notes $notes -Title "Latest Build (main) – ${{ steps.version.outputs.version }}"
